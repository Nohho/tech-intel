<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>科技情报站 Tech Intel</title>
<meta name="description" content="科技情报站 Tech Intel：57 家科技公司每日科技头条（领袖头条 + 公司动态，含 AI 前沿）。每天 07:30 前更新。">
<link rel="canonical" href="https://nohho.github.io/tech-intel/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="科技情报站 Tech Intel">
<meta property="og:url" content="https://nohho.github.io/tech-intel/">
<meta property="og:title" content="科技情报站 Tech Intel">
<meta property="og:description" content="57 家科技公司每日科技头条：领袖头条 + 公司动态">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="科技情报站 Tech Intel">
<meta name="twitter:description" content="57 家科技公司每日科技头条">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230284c7'/%3E%3Ctext x='32' y='42' font-size='30' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3ET%3C/text%3E%3C/svg%3E">
<style>
:root{
  --acc:#0284c7; --accB:#0ea5e9; --accD:#075985;
  --ink:#1c2733; --ink2:#26423a; --mut:#64748b; --line:#e2eae7;
  --bg:#f2f5f4; --card:#fff;
  --tagbg:#e0f1fd; --tagtx:#0369a1;   /* 天蓝标签 */
  --red:#e0654f;                       /* 头条徽章红 */
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.7;text-wrap:pretty}
header.top{background:linear-gradient(120deg,var(--accB) 0%,var(--acc) 55%,var(--accD) 100%);color:#fff;padding:20px 16px 12px}
header.top h1{font-size:20px;letter-spacing:.5px}
header.top .sub{font-size:12.5px;color:#d7ebe3;margin-top:6px}
header.top .sub b{color:#ffe9a8}
.fbar{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fbar input{flex:1 1 180px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);border-radius:12px;padding:8px 12px;font-size:13px;color:#fff;font-family:inherit;outline:none}
.fbar input::placeholder{color:#bcd8cd}
.fchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.fchip{flex:none;font-size:12.5px;color:#dcefe8;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);border-radius:14px;padding:5px 12px;cursor:pointer;font-family:inherit;font-weight:600}
.fchip.on{background:#fff;color:var(--ink2);font-weight:700;border-color:#fff}
.rsmeta{font-size:12px;color:#bcd8cd;margin-top:6px;min-height:16px}
main{max-width:780px;margin:0 auto;padding:6px 14px 30px}
.dayhead{display:flex;align-items:baseline;gap:8px;margin:16px 2px 2px}
.dayhead h2{font-size:17px;color:var(--ink2)}
.dayhead .cnt{font-size:12px;color:var(--mut);font-weight:600}
.stream{background:var(--card);border-radius:14px;padding:4px 16px;margin-top:8px;border:1px solid #eef2f7}
/* 紧凑行：aihot 式单列时间流 */
.srow{padding:11px 0;border-bottom:1px solid #eef2f7}
.srow:last-child{border-bottom:none}
.smeta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-bottom:4px}
.stime{font-weight:800;color:var(--ink2);font-size:13px;font-variant-numeric:tabular-nums}
.stop{font-size:11px;font-weight:800;color:#fff;background:var(--red);border-radius:9px;padding:1px 8px}
.sout{font-weight:700;color:var(--ink2);text-decoration:none}
a.sout:hover{text-decoration:underline;text-underline-offset:2px}
.fh{display:inline-block;font-size:11px;font-weight:700;color:#0a6b3a;background:#e6f4ec;border:1px solid #bfe3cd;border-radius:6px;padding:0 6px}
.fr{display:inline-block;font-size:11px;font-weight:700;color:#5b6b82;background:#eef2f7;border:1px solid #dfe5ee;border-radius:6px;padding:0 6px}
.srow h3{font-size:15.5px;margin:0 0 4px;line-height:1.5}
.srow h3 a{color:var(--ink);text-decoration:none;font-weight:700}
.srow h3 a:hover{text-decoration:underline;text-underline-offset:3px}
.ssum{font-size:13.5px;color:#33475c;margin:0 0 6px}
.stagrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.tag{font-size:12px;background:var(--tagbg);color:var(--tagtx);padding:2px 9px;border-radius:11px;font-weight:600}
.empty{padding:26px 0;text-align:center;color:var(--mut);font-size:14px}
.errbar{background:#fdeceb;border:1px solid #f3c1b8;color:#a3271c;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.errbar a{color:#a3271c;font-weight:700}
.loading,.errmsg{text-align:center;color:var(--mut);padding:40px 16px;font-size:14px}
footer.site{font-size:12px;color:var(--mut);text-align:center;padding:18px 16px 34px;line-height:1.9}
mark.hl{background:#fff3b0;border-radius:3px;padding:0 1px}
</style>
</head>
<body>
<header class="top">
  <h1>科技情报站 Tech Intel</h1>
  <div class="sub" id="subline"></div>
  <div class="fbar">
    <input id="q" placeholder="搜索本页内容…" autocomplete="off" spellcheck="false" oninput="__setQ(this.value)">
    <div class="fchips" id="chips"></div>
  </div>
  <div class="rsmeta" id="rsmeta"></div>
</header>
<main id="main">
  <div class="dayhead"><h2 id="daytitle"></h2><span class="cnt" id="daycnt"></span></div>
  <div class="stream" id="stream"><div class="loading">加载中…</div></div>
</main>
<footer class="site">
  <b>科技情报站 Tech Intel</b><br>
  数据来自每日公开信息核实汇总，仅作科技行业研究参考 · 不涉及证券买卖建议
</footer>
<script>
"use strict";
let DATA=[];
let CURDATE="";
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SECTIONS=["权重科技","芯片半导体","软件云AI","硬件存储","网络安全","AI前沿"];
const TOTAL_COS=57;
let _Q="",_SEC="all";
function sortRows(a){return a.slice().sort((x,y)=>String(y.date+" "+(y.time||"")).localeCompare(String(x.date+" "+(x.time||""))));}
function fpBadge(it){return it.first_party?'<span class="fh">一手</span>':'<span class="fr">转载</span>';}
function topBadge(it){return it.isTop?'<span class="stop">头条</span>':'';}
function coLabel(it){return it.company?it.company+(it.ticker?" "+it.ticker:""):"";}
function rowHTML(it){
  const src=it.url?`<a class="sout" href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.outlet||"")}</a>`:`<span class="sout">${esc(it.outlet||"")}</span>`;
  const ttl=it.url?`<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`:esc(it.title);
  const tags=(it.tags||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join("");
  return `<div class="srow" data-sec="${esc(it.section||"")}">`
    +`<div class="smeta"><span class="stime">${esc(it.time||"--:--")}</span>${topBadge(it)}<span>·</span>${src}${fpBadge(it)}</div>`
    +`<h3>${ttl}</h3>`
    +(it.summary?`<p class="ssum">${esc(it.summary)}</p>`:"")
    +`<div class="stagrow"><span>${esc(coLabel(it))}</span><span>·</span><span>${esc(it.section||"")}</span>${tags}</div>`
    +`</div>`;
}
function filtered(){
  const q=_Q.trim().toLowerCase();
  return sortRows(DATA).filter(it=>
    (_SEC==="all"||it.section===_SEC)&&
    (!q||((it.title||"")+" "+(it.summary||"")+" "+(it.company||"")+" "+(it.outlet||"")+" "+(it.tags||[]).join(" ")).toLowerCase().includes(q)));
}
function hl(q,html){
  if(!q)return html;
  const re=new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");
  return html.replace(re,"<mark class=\"hl\">$1</mark>");
}
function render(){
  const list=filtered();
  const q=_Q.trim();
  document.getElementById("stream").innerHTML=list.length?list.map(it=>hl(q,rowHTML(it))).join(""):'<div class="empty">无匹配内容</div>';
  const m=document.getElementById("rsmeta");
  if(m)m.textContent=q?`${list.length} 条匹配`:`共 ${list.length} 条`;
}
function renderChips(){
  const secs=SECTIONS.filter(s=>DATA.some(d=>d.section===s));
  document.getElementById("chips").innerHTML=[["all","全部"]].concat(secs.map(s=>[s,s]))
    .map(([v,lb])=>`<button class="fchip${_SEC===v?" on":""}" data-v="${esc(v)}" onclick="__setSEC('${esc(v)}')">${esc(lb)}</button>`).join("");
}
function __setQ(v){_Q=v;render();}
function __setSEC(v){_SEC=v;renderChips();render();}
function paintHead(){
  const cov=new Set(DATA.map(d=>d.company).filter(Boolean)).size;
  document.getElementById("subline").innerHTML=
    `今日覆盖 <b>${cov}</b>/${TOTAL_COS} 家 · 今日 <b>${DATA.length}</b> 条 · 数据截至今日 07:30（CST），覆盖近 5 天`;
  const dates=[...new Set(DATA.map(d=>d.date).filter(Boolean))].sort();
  const wk={"0":"星期日","1":"星期一","2":"星期二","3":"星期三","4":"星期四","5":"星期五","6":"星期六"};
  const wOf=d=>{try{return wk[String(new Date(d+"T12:00:00").getDay())]||"";}catch(e){return "";}};
  let title="";
  if(dates.length===1)title=`${dates[0].slice(5)} ${wOf(dates[0])}`;
  else if(dates.length>1)title=`${dates[0].slice(5)} ~ ${dates[dates.length-1].slice(5)}`;
  document.getElementById("daytitle").textContent=title;
  document.getElementById("daycnt").textContent=`${DATA.length} 条`;
  renderChips();
}
function localToday(){const n=new Date();const p=v=>String(v).padStart(2,"0");return n.getFullYear()+"-"+p(n.getMonth()+1)+"-"+p(n.getDate());}
async function loadDay(date){
  CURDATE=date;
  document.querySelectorAll(".errbar").forEach(b=>b.remove());
  try{
    const r=await fetch("data/"+date+".json");
    if(!r.ok)throw new Error("HTTP "+r.status);
    const j=await r.json();
    const flat=Array.isArray(j)?j:(j.top10||[]).map(x=>Object.assign({},x,{isTop:true})).concat((j.company_news||[]).map(x=>Object.assign({},x,{isTop:false})));
    DATA=flat;
    paintHead();
    render();
    try{history.replaceState(null,"","#date="+date);}catch(e){}
    window.scrollTo({top:0});
  }catch(e){
    const m=document.getElementById("main");
    if(m)m.insertAdjacentHTML("afterbegin",
      `<div class="errbar">${esc(date)} 的数据加载失败（${esc(e.message)}）。当前显示的可能是旧日期内容。<a href="javascript:loadDay(CURDATE)">点此重试</a></div>`);
  }
}
async function boot(){
  if(typeof document==="undefined"||!document.getElementById)return;
  try{
    const idx=await (await fetch("data/index.json")).json();
    const days=idx.days||[];
    const hm=(location.hash||"").match(/date=(\d{4}-\d{2}-\d{2})/);
    const today=localToday();
    const start=(hm&&days.indexOf(hm[1])>=0)?hm[1]
      :(days.indexOf(today)>=0?today:(idx.latest||days[days.length-1]||today));
    window.addEventListener("hashchange",()=>{
      const m2=(location.hash||"").match(/date=(\d{4}-\d{2}-\d{2})/);
      if(m2&&m2[1]!==CURDATE&&days.indexOf(m2[1])>=0)loadDay(m2[1]);
    });
    await loadDay(start);
  }catch(e){
    document.getElementById("stream").innerHTML='<div class="errmsg">情报数据加载失败，请稍后刷新重试。</div>';
  }
}
boot();
</script>
</body>
</html>
